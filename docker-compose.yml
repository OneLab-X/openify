# Shopkit production stack. Configure with .env (generate it with ./scripts/install.sh).
#   docker compose up -d --build --wait
#   docker compose --profile minio up -d     # adds a local S3-compatible object store
name: shopkit

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://shopkit:${POSTGRES_PASSWORD:?run scripts/install.sh}@postgres:5432/shopkit
  REDIS_URL: redis://redis:6379
  PUBLIC_URL: ${PUBLIC_URL:?run scripts/install.sh}
  SESSION_SECRET: ${SESSION_SECRET:?run scripts/install.sh}
  SHOPKIT_MASTER_KEY: ${SHOPKIT_MASTER_KEY:?run scripts/install.sh}
  SHOPKIT_MASTER_KEY_VERSION: ${SHOPKIT_MASTER_KEY_VERSION:-1}
  SHOPKIT_DATA_DIR: /data
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/install.sh}
      POSTGRES_DB: shopkit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopkit -d shopkit"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${SHOPKIT_IMAGE_PREFIX:-shopkit}/api:${SHOPKIT_VERSION:-local}
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["node", "dist/cli.js", "db:migrate"]
    environment:
      DATABASE_URL: postgres://shopkit:${POSTGRES_PASSWORD}@postgres:5432/shopkit
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    healthcheck:
      disable: true

  api:
    image: ${SHOPKIT_IMAGE_PREFIX:-shopkit}/api:${SHOPKIT_VERSION:-local}
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      PORT: "4000"
      TRUST_PROXY: "true"
    volumes:
      - shopkit-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    image: ${SHOPKIT_IMAGE_PREFIX:-shopkit}/worker:${SHOPKIT_VERSION:-local}
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    restart: unless-stopped
    environment:
      <<: *app-env
      STOREFRONT_INTERNAL_URL: http://storefront:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?run scripts/install.sh}
    volumes:
      - shopkit-data:/data
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  admin:
    image: ${SHOPKIT_IMAGE_PREFIX:-shopkit}/admin:${SHOPKIT_VERSION:-local}
    build: { context: ., dockerfile: docker/admin.Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  storefront:
    image: ${SHOPKIT_IMAGE_PREFIX:-shopkit}/storefront:${SHOPKIT_VERSION:-local}
    build: { context: ., dockerfile: docker/storefront.Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?run scripts/install.sh}
    depends_on:
      api: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      admin: { condition: service_healthy }
      storefront: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Local S3-compatible storage. MinIO no longer ships public images; RustFS speaks the same API
  # (see docs/DECISIONS.md D-003). In the wizard choose "MinIO / S3-compatible" with
  # endpoint http://minio:9000 and the credentials below.
  minio:
    image: rustfs/rustfs:1.0.5
    profiles: ["minio", "s3"]
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-shopkit}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-please}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || wget -q --spider http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  shopkit-data:
  caddy-data:
  caddy-config:
  minio-data:
